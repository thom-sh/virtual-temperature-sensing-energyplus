[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-temperature-sensing"
version = "0.1.0"
description = "EnergyPlus calibration pipeline for virtual temperature sensing with sparse sensor data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "eppy>=0.5.63",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vts = "vts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
